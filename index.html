
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>DEVIL GPT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #292929;color:#ff3030;font-size:23px;font-weight:bold}
main{max-width:800px;margin:auto;padding:18px}
h2{font-size:26px}
#status{color:#ff5555;font-size:14px;margin:14px 0}
button{background:#e51b2b;color:white;border:0;border-radius:10px;padding:13px 16px;font-weight:bold}
button:disabled{opacity:.5}
#load{width:100%}
progress{width:100%;accent-color:#e51b2b;margin:14px 0}
#chat{min-height:40vh}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;padding:14px;border-radius:12px;margin:12px 0}
.user{background:#301014;margin-left:12%}
.ai{background:#191919;margin-right:5%}
form{display:flex;gap:8px;position:sticky;bottom:0;background:#080808;padding:10px 0}
textarea{flex:1;min-width:0;min-height:48px;max-height:150px;background:#171717;color:white;border:1px solid #444;border-radius:10px;padding:12px;font-size:16px}
small{color:#aaa}
</style>
</head>
<body>
<header>🔴 DEVIL GPT</header>
<main>
<h2>Trí tuệ nhân tạo của bạn</h2>
<small>AI chạy trực tiếp trên thiết bị · Không dùng API AI bên ngoài</small>
<p><button id="load">TẢI VÀ KHỞI CHẠY AI</button></p>
<progress id="progress" max="100" value="0"></progress>
<div id="status">Chưa tải mô hình.</div>
<div id="chat"></div>
<form id="form">
<textarea id="prompt" placeholder="Nhập câu hỏi..." disabled required></textarea>
<button id="send" disabled>Gửi</button>
</form>
</main>
<script type="module">
const $=id=>document.getElementById(id);
let engine=null,busy=false,history=[];
function bubble(text,cls){
 const el=document.createElement("div");
 el.className="msg "+cls;
 el.textContent=text;
 $("chat").appendChild(el);
 return el;
}
$("load").onclick=async()=>{
 $("load").disabled=true;
 $("status").textContent="Đang tải thư viện AI...";
 try{
  const {CreateMLCEngine}=await import("https://esm.sh/@mlc-ai/web-llm");
  engine=await CreateMLCEngine(
   "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
   {initProgressCallback:p=>{
    $("status").textContent=p.text||"Đang tải mô hình...";
    if(typeof p.progress==="number")
     $("progress").value=Math.round(p.progress*100);
   }}
  );
  $("status").textContent="AI đã sẵn sàng!";
  $("prompt").disabled=false;
  $("send").disabled=false;
  $("load").textContent="AI ĐÃ SẴN SÀNG";
 }catch(e){
  engine=null;
  $("status").textContent="Lỗi: "+(e.message||e)+". Hãy thử Chrome mới nhất và kiểm tra bộ nhớ.";
  $("load").disabled=false;
 }
};
$("form").onsubmit=async e=>{
 e.preventDefault();
 const text=$("prompt").value.trim();
 if(!text||!engine||busy)return;
 busy=true;$("send").disabled=true;$("prompt").value="";
 bubble(text,"user");
 history.push({role:"user",content:text});
 const answer=bubble("Đang suy nghĩ...","ai");
 try{
  const stream=await engine.chat.completions.create({
   messages:[{role:"system",content:"Bạn là DEVIL GPT, trợ lý AI hữu ích, trả lời bằng tiếng Việt."},...history],
   stream:true
  });
  let result="";
  for await(const chunk of stream){
   result+=chunk.choices?.[0]?.delta?.content||"";
   answer.textContent=result;
  }
  if(result)history.push({role:"assistant",content:result});
 }catch(e){
  answer.textContent="Lỗi AI: "+(e.message||e);
  history.pop();
 }
 busy=false;$("send").disabled=false;
};
</script>
</body>
</html>
